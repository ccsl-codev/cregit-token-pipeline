# cregit-token-pipeline configuration.
# Paths may be absolute or relative to this repo; symlinks are resolved to
# their canonical form (blobExec refuses incremental resume on path drift).
# Edit both values to match your machine before a run.
[paths]
# cregit_dir is a checkout of the parameterized cregit runner
# (run_pipeline_process.sh). It must include rustTokenizer, or the pipeline
# cannot tokenize Rust projects.
cregit_dir = ../cregit
# output_dir holds one work directory per project. ctp.py creates it on import.
output_dir = ../ctp-output
