# cregit-token-pipeline configuration.
# Paths may be absolute or relative to this repo; symlinks are resolved to
# their canonical form (blobExec refuses incremental resume on path drift).
[paths]
# cregit-issue61 is the parameterised runner, and the only checkout that ships
# rustTokenizer. Point this at a checkout without it and every Rust project
# fails to tokenise. Do not point it back at `cregit-workspace/cregit`.
cregit_dir = ../cregit-workspace/cregit-issue61
output_dir = ../cregit-workspace/corpus-files
