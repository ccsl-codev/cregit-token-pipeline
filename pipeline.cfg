# cregit-token-pipeline configuration.
# Paths may be absolute or relative to this repo; symlinks are resolved to
# their canonical form (blobExec refuses incremental resume on path drift).
[paths]
# cregit-issue61 is the parameterised runner. It is the ONLY checkout with
# rustTokenizer, so the plain `cregit` checkout cannot tokenise the 315 Rust
# projects in the corpus. Do not point this back at `cregit-workspace/cregit`.
cregit_dir = /home/ellianco/Projects/cregit-workspace/cregit-issue61
output_dir = /home/ellianco/Projects/cregit-workspace/corpus-files
