name: CI

# Plain setup-python + pip: this repository is Python and duckdb only, so the
# Nix/devenv toolchain the sibling cregit repository needs would buy nothing.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The requires-python floor, and the newest release.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # run_tests.sh looks for .venv/bin/coverage and exits 2 without it.
      - name: Install dependencies from pyproject.toml
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
          .venv/bin/python -c 'import duckdb, pytest; print(duckdb.__version__, pytest.__version__)'

      # Fails on a failing test or on coverage below the .coveragerc floor.
      # Tests that need a cregit checkout self-skip on a runner.
      - name: Run the test suite
        run: ./run_tests.sh --junitxml=junit-${{ matrix.python-version }}.xml

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python-version }}
          path: junit-${{ matrix.python-version }}.xml
          if-no-files-found: warn
